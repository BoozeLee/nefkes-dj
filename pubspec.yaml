name: nefkes_dj_web
description: Nefkes DJ Website with Nefchat AI Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/nefkes_avatar.png
  
  fonts:
    - family: Cinzel
      fonts:
        - asset: fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: fonts/Cinzel-Bold.ttf
          weight: 700